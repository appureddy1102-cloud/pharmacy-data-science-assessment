[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pharmacy-ds-assessment"
version = "1.0.0"
description = "Beginner data science assessment using synthetic pharmacy operations data"
requires-python = ">=3.11"
dependencies = ["numpy>=2.3,<3", "pandas>=2.2,<3", "scipy>=1.17,<2", "matplotlib>=3.10,<4", "seaborn>=0.13,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Independent tutorial cells intentionally repeat imports after earlier cells.
"notebooks/*.ipynb" = ["E402"]
